# pyproject.toml

[build-system]

requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SignetPlugin"
version = "0.0.1"
description = "Signet plugin for Locksmith application to walk Onyx's UDAP vLEI onboarding flow."
readme = "README.md"
requires-python = ">=3.12.9"
license = { text = "MIT" }

authors = [
    { name = "Ari Argoud", email = "ariargoud@gmail.com" },
]

keywords = ["healthKERI", "cryptography", "KERI", "ACDC", "UDAP", "vLEI"]

classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "locksmith>=0.0.1",
    "acdc-auth-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "responses>=0.23.0",
]

# acdc-auth-client has no release or tag yet: resolve it from the sibling checkout.
[tool.uv.sources]
acdc-auth-client = { path = "../echelon-client", editable = true }

[project.entry-points."locksmith.plugins"]
signet = "signet.plugin:SignetPlugin"


[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
